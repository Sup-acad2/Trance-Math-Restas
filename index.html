<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trance Math Space - Subtraction Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b0e14; overflow: hidden;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif; touch-action: none;
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }

        /* --- INTERFAZ SUPERIOR --- */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }

        #top-bar {
            width: 100%; max-width: 650px; display: flex;
            justify-content: space-between; padding: 15px 20px 5px 20px;
        }

        .hud-badge {
            background: #18222d; border: 2px solid #37464f; border-bottom: 4px solid #37464f;
            color: #ffffff; padding: 8px 16px; border-radius: 18px; font-size: 16px;
            font-weight: 800; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s;
        }

        .hud-btn {
            pointer-events: auto; cursor: pointer; outline: none;
            user-select: none; font-size: 18px;
        }
        .hud-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        #comboDisplay { color: #ffd700; border-color: #ffd700; }

        /* HUD DEL JEFE */
        #boss-hud {
            width: 90%; max-width: 420px; display: none;
            flex-direction: column; align-items: center; gap: 3px; margin-top: 5px;
        }

        #boss-name {
            color: #ff2a2a; font-weight: 900; font-size: 14px;
            letter-spacing: 1px; text-shadow: 0 0 10px #ff2a2a;
        }

        #boss-hp-outer {
            width: 100%; height: 14px; background: #18222d; border: 2px solid #ff2a2a;
            border-radius: 10px; overflow: hidden; box-shadow: 0 0 12px rgba(255, 42, 42, 0.4);
        }

        #boss-hp-inner {
            width: 100%; height: 100%; background: linear-gradient(90deg, #ff2a2a, #ff7b00);
            transition: width 0.3s ease;
        }

        #problem-container {
            margin-top: 8px; font-size: 28px; font-weight: 900; color: #ffffff;
            background: #18222d; padding: 10px 30px; border-radius: 22px;
            border: 2px solid #37464f; border-bottom: 5px solid #37464f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 10;
        }

        #status-container {
            position: absolute; top: 160px; display: flex;
            flex-direction: column; gap: 5px; align-items: center;
        }

        .status-banner {
            padding: 4px 12px; border-radius: 10px; font-weight: 800; font-size: 12px;
            letter-spacing: 1px; display: none; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #slow-indicator { background: rgba(168, 85, 247, 0.25); border: 2px solid #a855f7; color: #d8b4fe; }
        #laser-indicator { background: rgba(57, 255, 20, 0.25); border: 2px solid #39ff14; color: #b3ff99; }
        #fever-indicator { background: rgba(255, 0, 128, 0.25); border: 2px solid #ff0080; color: #ff99dd; }

        /* --- MENÚ --- */
        #menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: auto; background: #ffffff; padding: 30px 26px;
            border-radius: 28px; border: 2px solid #e5e5e5; border-bottom: 6px solid #e5e5e5;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 90%; max-width: 380px;
        }

        h1 { color: #58cc02; font-size: 32px; font-weight: 900; margin: 0 0 5px 0; }
        
        .btn-duo {
            background-color: #58cc02; color: #ffffff; font-size: 18px; font-weight: 800;
            text-transform: uppercase; border: none; border-bottom: 5px solid #46a302;
            padding: 14px 0; width: 100%; border-radius: 18px; cursor: pointer; margin-top: 15px;
        }
        .btn-duo:active { transform: translateY(3px); border-bottom: 2px solid #46a302; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="top-bar">
            <div class="hud-badge" id="scoreDisplay">⭐ 0</div>
            <div class="hud-badge" id="comboDisplay">🔥 x1</div>
            <div class="hud-badge" id="livesDisplay">❤️ 3</div>
            <button class="hud-badge hud-btn" id="musicToggleBtn" title="Encender/Apagar Música">🔊</button>
        </div>

        <div id="boss-hud">
            <span id="boss-name">👾 PANDILLA ALIEN</span>
            <div id="boss-hp-outer"><div id="boss-hp-inner"></div></div>
        </div>

        <div id="problem-container" style="display: none;">
            <span id="mathProblem">25 - 12 = ?</span>
        </div>
        
        <div id="status-container">
            <div id="slow-indicator" class="status-banner">⏳ MATRIZ DE TIEMPO ACTIVA</div>
            <div id="laser-indicator" class="status-banner">⚡ LÁSER DESINTEGRADOR ACTIVO</div>
            <div id="fever-indicator" class="status-banner">🌟 FIEBRE ESTELAR (PUNTOS x2)</div>
        </div>
    </div>

    <div id="menu">
        <h1>TRANCE MATH</h1>
        <p style="color: #afb5c0; font-weight: 800; margin: 0; font-size: 14px;">RESTAS RÁPIDAS</p>
        <p style="color: #4b4b4b; font-size: 13px; font-weight: 700; margin-top: 15px;">
            Derrota a las patrullas alienígenas resolviendo restas en los <b>300, 1,000, 2,500 y 5,000 Puntos</b>.
        </p>
        <h2 id="finalScore" style="display: none; color: #1cb0f6;"></h2>
        <button id="startBtn" class="btn-duo">EMPEZAR</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const startBtn = document.getElementById('startBtn');
        const problemContainer = document.getElementById('problem-container');
        const mathProblemEl = document.getElementById('mathProblem');
        const scoreEl = document.getElementById('scoreDisplay');
        const comboEl = document.getElementById('comboDisplay');
        const livesEl = document.getElementById('livesDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const musicToggleBtn = document.getElementById('musicToggleBtn');

        const bossHud = document.getElementById('boss-hud');
        const bossNameEl = document.getElementById('boss-name');
        const bossHpInner = document.getElementById('boss-hp-inner');

        const slowIndicatorEl = document.getElementById('slow-indicator');
        const laserIndicatorEl = document.getElementById('laser-indicator');
        const feverIndicatorEl = document.getElementById('fever-indicator');

        // --- CONFIGURACIÓN DE MÚSICA ---
        const bgMusic = new Audio('bgmusic.mp3'); 
        bgMusic.loop = true;
        bgMusic.volume = 0.5;
        let isMuted = false;

        bgMusic.onerror = () => {
            alert("⚠️ No se pudo cargar 'bgmusic.mp3'.\n\n1. Revisa que el archivo se llame exactamente 'bgmusic.mp3'.\n2. Confirma que esté en la misma carpeta que este HTML.");
        };

        musicToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            musicToggleBtn.innerText = isMuted ? '🔇' : '🔊';
        });

        let limitY = 0;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            limitY = canvas.height * 0.4;
        }
        window.addEventListener('resize', resize);
        resize();

        let isPlaying = false;
        let score = 0;
        let lives = 3;
        let streak = 0;
        let speedMultiplier = 1;
        let problemPenalized = false;

        let slowTimeTimer = 0;
        let laserTimer = 0;
        let feverTimer = 0;

        let currentAnswer = 0;
        let lastObstacleSpawn = 0;

        let isBossActive = false;
        let bossHp = 0;
        let maxBossHp = 0;
        let currentBossData = null;
        let triggeredBosses = [];
        let correctAnswersSinceLastBoss = 8;

        const BOSS_CONFIGS = [
            { threshold: 300, name: '👾 CLAN CIBER-DRONE', hp: 3, color: '#00ffff', bonus: 100, type: 1 },
            { threshold: 1000, name: '⚡ ESCUADRÓN NEÓN PLASMA', hp: 4, color: '#ffd700', bonus: 200, type: 2 },
            { threshold: 2500, name: '💥 HORDA TITANIO V.O.I.D.', hp: 5, color: '#ff4b4b', bonus: 400, type: 3 },
            { threshold: 5000, name: '👑 DINASTÍA DEL CAOS', hp: 6, color: '#ff0080', bonus: 800, type: 4 }
        ];

        let player = { x: canvas.width / 2, y: canvas.height - 100, radius: 15, speed: 8, hasShield: false };
        let entities = [];
        let stars = [];
        let particles = [];
        let fallingHearts = [];
        const keys = {};

        let shakeDuration = 0;
        let shakeIntensity = 0;

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        for(let i = 0; i < 120; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 0.5, speed: Math.random() * 3 + 1 });
        }

        function movePlayerPointer(e) {
            if (!isPlaying) return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            player.x = clientX;
            player.y = Math.max(limitY + player.radius, clientY - 40);
        }
        window.addEventListener('mousemove', movePlayerPointer);
        window.addEventListener('touchmove', movePlayerPointer, {passive: false});

        function updateKeyboardMovement() {
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(limitY + player.radius, Math.min(canvas.height - player.radius, player.y));
        }

        function checkBossSpawn() {
            if (isBossActive) return;
            if (correctAnswersSinceLastBoss < 8) return;

            for (let boss of BOSS_CONFIGS) {
                if (score >= boss.threshold && !triggeredBosses.includes(boss.threshold)) {
                    startBossBattle(boss);
                    break;
                }
            }
        }

        function startBossBattle(boss) {
            isBossActive = true;
            currentBossData = boss;
            triggeredBosses.push(boss.threshold);
            bossHp = boss.hp;
            maxBossHp = boss.hp;

            bossNameEl.innerText = boss.name;
            bossHud.style.display = 'flex';
            updateBossHpUI();

            triggerShake(18, 15);
            entities = entities.filter(ent => ent.type !== 'target');
            generateProblem();
        }

        function updateBossHpUI() {
            let pct = (bossHp / maxBossHp) * 100;
            bossHpInner.style.width = `${Math.max(0, pct)}%`;
        }

        // --- GENERACIÓN ÚNICAMENTE DE RESTAS ---
        function generateProblem() {
            problemPenalized = false;
            let a, b, c;
            
            if (isBossActive) {
                if (currentBossData.type === 1) {
                    a = Math.floor(Math.random() * 40) + 20;
                    b = Math.floor(Math.random() * (a - 5)) + 5;
                    currentAnswer = a - b;
                    mathProblemEl.innerText = `JEFE: ${a} - ${b} = ?`;
                } else if (currentBossData.type === 2) {
                    a = Math.floor(Math.random() * 50) + 30;
                    b = Math.floor(Math.random() * 15) + 5;
                    c = Math.floor(Math.random() * 10) + 2;
                    currentAnswer = a - b - c;
                    mathProblemEl.innerText = `JEFE: ${a} - ${b} - ${c} = ?`;
                } else if (currentBossData.type === 3) {
                    a = Math.floor(Math.random() * 60) + 40;
                    b = Math.floor(Math.random() * 20) + 10;
                    c = Math.floor(Math.random() * 15) + 5;
                    currentAnswer = a - b - c;
                    mathProblemEl.innerText = `JEFE: ${a} - ${b} - ${c} = ?`;
                } else {
                    a = Math.floor(Math.random() * 80) + 60;
                    b = Math.floor(Math.random() * 25) + 15;
                    c = Math.floor(Math.random() * 20) + 10;
                    currentAnswer = a - b - c;
                    mathProblemEl.innerText = `JEFE: ${a} - ${b} - ${c} = ?`;
                }
            } else {
                a = Math.floor(Math.random() * 50) + 20;
                b = Math.floor(Math.random() * (a - 5)) + 5;
                currentAnswer = a - b;
                mathProblemEl.innerText = `${a} - ${b} = ?`;
            }

            let options = [currentAnswer];
            while(options.length < 3) {
                let diff = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let fake = currentAnswer + diff;
                if(fake > 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => Math.random() - 0.5);

            let baseTargetSpeed = 3.0;
            if (isBossActive && currentBossData) {
                baseTargetSpeed = Math.max(1.0, 2.3 - (currentBossData.type * 0.3));
            }

            const spacing = canvas.width / 4;
            options.forEach((opt, index) => {
                entities.push({
                    type: 'target',
                    value: opt,
                    isCorrect: opt === currentAnswer,
                    x: spacing * (index + 1),
                    y: -50 - (Math.random() * 60),
                    radius: 32,
                    speed: baseTargetSpeed * speedMultiplier
                });
            });

            if (Math.random() < 0.45) {
                const powerups = ['powerup_slow', 'powerup_shield', 'powerup_emp', 'powerup_laser', 'powerup_hacker', 'powerup_fever'];
                let selected = powerups[Math.floor(Math.random() * powerups.length)];
                entities.push({
                    type: selected,
                    x: Math.random() * (canvas.width - 140) + 70,
                    y: -100 - (Math.random() * 60),
                    radius: 22,
                    speed: 2.5 * speedMultiplier
                });
            }
        }

        function spawnObstacle() {
            entities.push({
                type: 'obstacle',
                x: Math.random() * canvas.width, y: -50,
                radius: Math.random() * 15 + 15,
                speed: (Math.random() * 3 + 3) * speedMultiplier,
                angle: 0, spin: Math.random() * 0.1 - 0.05
            });
        }

        function createParticles(x, y, color, count = 18) {
            for(let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                    life: 1, color: color
                });
            }
        }

        function triggerShake(intensity = 12, duration = 15) {
            shakeIntensity = intensity; shakeDuration = duration;
        }

        function spawnFallingHeart() {
            const rect = livesEl.getBoundingClientRect();
            fallingHearts.push({
                x: rect.left + rect.width / 2, y: rect.bottom,
                vy: 7, angle: 0, spin: (Math.random() - 0.5) * 0.4
            });
        }

        function updateComboUI() {
            let comboLevel = 1 + Math.floor(streak / 3);
            comboEl.innerText = `🔥 x${comboLevel}`;
        }

        function breakStreak() {
            streak = 0; updateComboUI();
        }

        function gameOver() {
            isPlaying = false;
            
            bgMusic.pause();
            bgMusic.currentTime = 0;

            bossHud.style.display = 'none';
            slowIndicatorEl.style.display = 'none';
            laserIndicatorEl.style.display = 'none';
            feverIndicatorEl.style.display = 'none';
            menu.style.display = 'block';
            problemContainer.style.display = 'none';
            finalScoreEl.style.display = 'block';
            finalScoreEl.innerText = `Puntos: ${score}`;
            startBtn.innerText = 'REINTENTAR';
        }

        function drawSideBossGangs() {
            if (!isBossActive || !currentBossData) return;

            let time = Date.now() * 0.002;

            let leftBaseX = Math.min(100, canvas.width * 0.15);
            let rightBaseX = Math.max(canvas.width - 100, canvas.width * 0.85);
            let baseY = 130;

            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = currentBossData.color;
            ctx.fillStyle = '#18222d';
            ctx.strokeStyle = currentBossData.color;
            ctx.lineWidth = 3;

            for (let i = 0; i < 3; i++) {
                let phase = time + (i * 0.8);
                let px = leftBaseX + Math.sin(phase) * 40;
                let py = baseY + Math.sin(phase * 2) * 22 + (i * 12);

                ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = currentBossData.color;
                ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#18222d';
            }

            for (let i = 0; i < 3; i++) {
                let phase = time + (i * 0.8) + Math.PI;
                let px = rightBaseX + Math.sin(phase) * 40;
                let py = baseY + Math.sin(phase * 2) * 22 + (i * 12);

                ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = currentBossData.color;
                ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#18222d';
            }

            ctx.restore();
        }

        function defeatBoss() {
            score += currentBossData.bonus;
            scoreEl.innerText = `⭐ ${score}`;
            
            createParticles(Math.min(100, canvas.width * 0.15), 130, currentBossData.color, 35);
            createParticles(Math.max(canvas.width - 100, canvas.width * 0.85), 130, currentBossData.color, 35);
            triggerShake(22, 20);

            isBossActive = false;
            correctAnswersSinceLastBoss = 0;
            bossHud.style.display = 'none';
            feverTimer = 600;

            entities = entities.filter(ent => ent.type === 'target');
            generateProblem();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            let auraColor = feverTimer > 0 ? '#ff0080' : (streak >= 6 ? '#ff007f' : (streak >= 3 ? '#ffd700' : '#00ffff'));

            if (player.hasShield) {
                ctx.beginPath(); ctx.arc(0, 0, player.radius + 14, 0, Math.PI * 2);
                ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 3; ctx.shadowBlur = 18; ctx.shadowColor = '#00d2ff';
                ctx.stroke();
            }

            if (laserTimer > 0) {
                ctx.shadowBlur = 20; ctx.shadowColor = '#39ff14'; ctx.strokeStyle = '#39ff14';
                ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -player.y); ctx.stroke();
            }

            ctx.beginPath();
            ctx.moveTo(0, -20); ctx.lineTo(15, 15); ctx.lineTo(-15, 15); ctx.closePath();
            ctx.shadowBlur = 20; ctx.shadowColor = auraColor; ctx.fillStyle = auraColor;
            ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
        }

        function update(timestamp = 0) {
            ctx.save();
            if (shakeDuration > 0) {
                ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
                shakeDuration--;
            }

            ctx.fillStyle = '#0b0e14';
            ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

            let isTimeSlow = slowTimeTimer > 0;
            if (isTimeSlow) { slowTimeTimer--; slowIndicatorEl.style.display = 'block'; } else { slowIndicatorEl.style.display = 'none'; }
            if (laserTimer > 0) { laserTimer--; laserIndicatorEl.style.display = 'block'; } else { laserIndicatorEl.style.display = 'none'; }
            if (feverTimer > 0) { feverTimer--; feverIndicatorEl.style.display = 'block'; } else { feverIndicatorEl.style.display = 'none'; }

            let speedFactor = (isPlaying ? speedMultiplier : 0.5) * (isTimeSlow ? 0.4 : 1.0);
            stars.forEach(star => {
                star.y += star.speed * speedFactor;
                if (star.y > canvas.height) star.y = 0;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();
            });

            if (isPlaying) {
                checkBossSpawn();
                updateKeyboardMovement();
                drawSideBossGangs();
                drawPlayer();

                ctx.save();
                ctx.setLineDash([10, 10]);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, limitY);
                ctx.lineTo(canvas.width, limitY);
                ctx.stroke();
                ctx.restore();

                if (laserTimer > 0) {
                    for (let j = entities.length - 1; j >= 0; j--) {
                        let obs = entities[j];
                        if (obs.type === 'obstacle' && obs.y < player.y) {
                            if (Math.abs(obs.x - player.x) < obs.radius + 8) {
                                createParticles(obs.x, obs.y, '#39ff14', 15);
                                entities.splice(j, 1);
                            }
                        }
                    }
                }

                let obstacleInterval = (1000 / speedMultiplier) * (isTimeSlow ? 2.5 : 1.0);
                if (timestamp - lastObstacleSpawn > obstacleInterval) {
                    spawnObstacle();
                    lastObstacleSpawn = timestamp;
                }

                let resetProblemNeeded = false;

                for (let i = entities.length - 1; i >= 0; i--) {
                    let e = entities[i];
                    e.y += e.speed * (isTimeSlow ? 0.4 : 1.0);

                    let dx = player.x - e.x, dy = player.y - e.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < player.radius + e.radius) {
                        if (e.type === 'target') {
                            if (e.isCorrect) {
                                streak++;
                                correctAnswersSinceLastBoss++;
                                let multiplier = 1 + Math.floor(streak / 3);
                                let pointsGained = 10 * multiplier * (feverTimer > 0 ? 2 : 1);
                                score += pointsGained;
                                speedMultiplier += 0.03;
                                scoreEl.innerText = `⭐ ${score}`;
                                updateComboUI();
                                createParticles(e.x, e.y, feverTimer > 0 ? '#ff0080' : '#58cc02', 20);

                                if (isBossActive) {
                                    bossHp--;
                                    updateBossHpUI();
                                    triggerShake(12, 10);
                                    if (bossHp <= 0) {
                                        defeatBoss();
                                        continue;
                                    }
                                }
                                resetProblemNeeded = true;
                            } else {
                                breakStreak(); lives--;
                                problemPenalized = true;
                                livesEl.innerText = `❤️ ${lives}`;
                                triggerShake(14, 12);
                                spawnFallingHeart();
                                createParticles(e.x, e.y, '#ff4b4b');
                                entities.splice(i, 1);
                                if (lives <= 0) gameOver();
                            }
                        } else if (e.type === 'obstacle') {
                            if (player.hasShield) {
                                player.hasShield = false;
                                createParticles(e.x, e.y, '#00d2ff');
                            } else {
                                breakStreak(); lives--;
                                livesEl.innerText = `❤️ ${lives}`;
                                triggerShake(14, 12);
                                spawnFallingHeart();
                                createParticles(e.x, e.y, '#ff4b4b');
                                if (lives <= 0) gameOver();
                            }
                            entities.splice(i, 1);
                        } else if (e.type.startsWith('powerup_')) {
                            if (e.type === 'powerup_slow') slowTimeTimer = 300;
                            if (e.type === 'powerup_shield') player.hasShield = true;
                            if (e.type === 'powerup_emp') {
                                entities = entities.filter(ent => ent.type !== 'obstacle');
                                triggerShake(16, 15);
                            }
                            if (e.type === 'powerup_laser') laserTimer = 360;
                            if (e.type === 'powerup_hacker') {
                                let fakes = entities.filter(ent => ent.type === 'target' && !ent.isCorrect);
                                fakes.slice(0, 2).forEach(fakeTarget => {
                                    createParticles(fakeTarget.x, fakeTarget.y, '#ff2a2a', 12);
                                    let idx = entities.indexOf(fakeTarget);
                                    if (idx !== -1) entities.splice(idx, 1);
                                });
                            }
                            if (e.type === 'powerup_fever') feverTimer = 480;
                            createParticles(e.x, e.y, '#ffffff');
                            entities.splice(i, 1);
                        }
                        continue;
                    }

                    if (e.y > canvas.height + 50) {
                        if (e.type === 'target' && e.isCorrect) {
                            if (!problemPenalized) {
                                breakStreak(); lives--;
                                livesEl.innerText = `❤️ ${lives}`;
                                triggerShake(14, 12);
                                spawnFallingHeart();
                                if (lives <= 0) gameOver();
                            }
                            resetProblemNeeded = true;
                        } else {
                            entities.splice(i, 1);
                        }
                        continue;
                    }

                    ctx.save();
                    ctx.translate(e.x, e.y);
                    if (e.type === 'obstacle') {
                        ctx.strokeStyle = '#ff4b4b'; ctx.lineWidth = 3;
                        ctx.strokeRect(-e.radius, -e.radius, e.radius * 2, e.radius * 2);
                    } else if (e.type === 'target') {
                        ctx.fillStyle = '#18222d'; ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = isBossActive ? '#ff2a2a' : '#1cb0f6'; ctx.lineWidth = 3; ctx.stroke();
                        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px Nunito, sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.value, 0, 0);
                    } else if (e.type.startsWith('powerup_')) {
                        let pColor = '#ffffff', pIcon = '❓';
                        if (e.type === 'powerup_slow') { pColor = '#a855f7'; pIcon = '⏳'; }
                        else if (e.type === 'powerup_shield') { pColor = '#00d2ff'; pIcon = '🛡️'; }
                        else if (e.type === 'powerup_emp') { pColor = '#ff6600'; pIcon = '💥'; }
                        else if (e.type === 'powerup_laser') { pColor = '#39ff14'; pIcon = '⚡'; }
                        else if (e.type === 'powerup_hacker') { pColor = '#ff2a2a'; pIcon = '🎯'; }
                        else if (e.type === 'powerup_fever') { pColor = '#ff0080'; pIcon = '🌟'; }

                        ctx.shadowBlur = 18; ctx.shadowColor = pColor;
                        ctx.fillStyle = '#18222d'; ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = pColor; ctx.lineWidth = 3; ctx.stroke();
                        ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(pIcon, 0, 0);
                    }
                    ctx.restore();
                }

                if (resetProblemNeeded) {
                    entities = entities.filter(ent => ent.type !== 'target');
                    if (isPlaying) generateProblem();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
                }

                for (let i = fallingHearts.length - 1; i >= 0; i--) {
                    let h = fallingHearts[i];
                    h.y += h.vy; h.angle += h.spin;
                    let halfScreen = canvas.height / 2;
                    let alpha = 1 - (h.y / halfScreen);
                    if (h.y >= halfScreen) { fallingHearts.splice(i, 1); continue; }

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.translate(h.x, h.y); ctx.rotate(h.angle);
                    ctx.font = '36px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('💔', 0, 0);
                    ctx.restore();
                }
            }

            ctx.restore();
            requestAnimationFrame(update);
        }

        startBtn.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log("Audio no iniciado:", err));

            menu.style.display = 'none';
            problemContainer.style.display = 'block';
            isPlaying = true; score = 0; lives = 3; streak = 0; speedMultiplier = 1;
            problemPenalized = false;
            slowTimeTimer = 0; laserTimer = 0; feverTimer = 0;
            isBossActive = false; triggeredBosses = [];
            correctAnswersSinceLastBoss = 8;
            bossHud.style.display = 'none';
            scoreEl.innerText = `⭐ ${score}`; livesEl.innerText = `❤️ ${lives}`;
            updateComboUI();
            player.x = canvas.width / 2; player.y = canvas.height - 100;
            entities = []; particles = []; fallingHearts = [];
            generateProblem();
        });

        requestAnimationFrame(update);
    </script>
</body>
</html>
